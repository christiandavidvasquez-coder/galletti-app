<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: cabecera fija arriba, contenido de máx. 1240 px centrado, barra inferior de pestañas bajo 760 px.
   Lenguaje visual v5: carta de café impresa / libro de cuentas. Esquinas rectas, sin sombras, filetes dorados de 1 px,
   doble filete en cabeceras de sección, sellos cuadrados para etiquetas, campos de libro con solo regla inferior. */
:root {
  --bg: #F6F1E7; --surface: #FFFDF8; --surface-2: #EFE8DA; --fg: #1D2433; --muted: #5B6271; --line: #DCD2BF;
  --primary: #1B2A4A; --on-primary: #FFFFFF; --primary-soft: #E2E7F1; --header-bg: #1B2A4A; --header-fg: #F6F1E7;
  --accent: #9C7A41; --accent-soft: #F2E7D2; --accent-line: #C9A86A;
  --ok: #2E7A4D; --ok-soft: #E0F0E5; --warn: #9E650F; --warn-soft: #FAEACD; --bad: #B03636; --bad-soft: #F7DFDC; --closed: #8C8A84;
  --f-ap: #DCE9F6; --f-ap-b: #6F98C6; --f-in: #F3E8D2; --f-in-b: #B99659; --f-ci: #E5E0F3; --f-ci-b: #8576BC;
  --f-ce: #D4D8F1; --f-ce-b: #4F58A6; --f-pa: #D8EEEA; --f-pa-b: #4E9B8F; --f-ef: #E6EED6; --f-ef-b: #7F9750;
  --f-au: #F6E0E0; --f-au-b: #C46A6A; --f-ot: #ECEAE4; --f-ot-b: #A39E93; --f-in-dep: #2E7A4D;
  /* forma y filetes */
  --r: 0px; --r-s: 2px;
  --rule: var(--accent-line);           /* filete dorado */
  --rule-ink: #8A93A6;                  /* regla de campo, navy apagado */
  --hair: 1px solid var(--line);
  --focus: #9C7A41;                     /* anillo de foco dorado */
  --focus-on-dark: #E2C88F;
  /* botón principal: navy con filete dorado interior */
  --btn-bg: #1B2A4A; --btn-fg: #FFFFFF; --btn-hover-fg: #E2C88F; --on-bad: #FFFFFF;
  --hdr-hover: color-mix(in srgb, var(--header-fg) 8%, transparent);
  --scrim: color-mix(in srgb, #0A101C 48%, transparent);
  --ease: 120ms ease-out;
  --font-ui: "Source Sans 3", "Source Sans Pro", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --font-head: "Marcellus", "Cormorant Garamond", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1420; --surface: #151D2C; --surface-2: #1B2537; --fg: #E9E4D9; --muted: #A2A8B5; --line: #2A3549;
    --primary: #AFC3EA; --on-primary: #0E1420; --primary-soft: #22314F; --header-bg: #111A2B; --header-fg: #EDE6D6;
    --accent: #D6B47C; --accent-soft: #352C1E; --accent-line: #8E7448;
    --ok: #6BC28F; --ok-soft: #173326; --warn: #E6AD52; --warn-soft: #3A2C15; --bad: #F08484; --bad-soft: #3D1F23; --closed: #7D8492;
    --f-ap: #1C2D44; --f-ap-b: #5F8FC4; --f-in: #33291A; --f-in-b: #B8955A; --f-ci: #2A2442; --f-ci-b: #9384D0;
    --f-ce: #222A4F; --f-ce-b: #7C86D8; --f-pa: #163432; --f-pa-b: #4FB0A1; --f-ef: #263018; --f-ef-b: #9AB46A;
    --f-au: #3A1F24; --f-au-b: #D27C7C; --f-ot: #20252F; --f-ot-b: #6D7480; --f-in-dep: #6BC28F;
    --rule-ink: #56627A; --focus: #D6B47C; --focus-on-dark: #D6B47C;
    --btn-bg: #22314F; --btn-fg: #EDE6D6; --btn-hover-fg: #D6B47C; --on-bad: #0E1420;
    --scrim: color-mix(in srgb, #000 60%, transparent);
    color-scheme: dark;
  }
  :root:not([data-theme="light"]) .gallo-lt { display: none !important; }
  :root:not([data-theme="light"]) .gallo-dk { display: block !important; }
  :root:not([data-theme="light"]) .wm { opacity: .06; }
  :root:not([data-theme="light"]) .bg-wm img { opacity: .08; }
}
:root[data-theme="dark"] {
  --bg: #0E1420; --surface: #151D2C; --surface-2: #1B2537; --fg: #E9E4D9; --muted: #A2A8B5; --line: #2A3549;
  --primary: #AFC3EA; --on-primary: #0E1420; --primary-soft: #22314F; --header-bg: #111A2B; --header-fg: #EDE6D6;
  --accent: #D6B47C; --accent-soft: #352C1E; --accent-line: #8E7448;
  --ok: #6BC28F; --ok-soft: #173326; --warn: #E6AD52; --warn-soft: #3A2C15; --bad: #F08484; --bad-soft: #3D1F23; --closed: #7D8492;
  --f-ap: #1C2D44; --f-ap-b: #5F8FC4; --f-in: #33291A; --f-in-b: #B8955A; --f-ci: #2A2442; --f-ci-b: #9384D0;
  --f-ce: #222A4F; --f-ce-b: #7C86D8; --f-pa: #163432; --f-pa-b: #4FB0A1; --f-ef: #263018; --f-ef-b: #9AB46A;
  --f-au: #3A1F24; --f-au-b: #D27C7C; --f-ot: #20252F; --f-ot-b: #6D7480; --f-in-dep: #6BC28F;
  --rule-ink: #56627A; --focus: #D6B47C; --focus-on-dark: #D6B47C;
  --btn-bg: #22314F; --btn-fg: #EDE6D6; --btn-hover-fg: #D6B47C; --on-bad: #0E1420;
  --scrim: color-mix(in srgb, #000 60%, transparent);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 16px; line-height: 1.45; overflow-x: hidden; }
h1, h2, h3 { font-family: var(--font-head); font-weight: 400; letter-spacing: .01em; margin: 0; }
h1 { font-size: 1.75rem; line-height: 1.2; } h2 { font-size: 1.32rem; line-height: 1.25; } h3 { font-size: 1.08rem; }
.num, td.n, .kpi b, table, .chip { font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--r); }
.top :focus-visible, .nav-bot :focus-visible, .toast :focus-visible { outline-color: var(--focus-on-dark); }
[hidden] { display: none !important; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* cabecera: banda navy, doble filete dorado debajo */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--header-bg); color: var(--header-fg); border-bottom: 4px double var(--rule); }
.top .wrap { display: flex; align-items: stretch; gap: 16px; padding-block: 0; min-height: 76px; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; padding-block: 12px; }
.brand .logo { height: 50px; width: auto; display: block; flex: none; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.brand span { font-family: var(--font-head); font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-line); white-space: nowrap; padding-left: 14px; border-left: 1px solid color-mix(in srgb, var(--accent-line) 60%, transparent); }
.nav-top { display: flex; gap: 2px; margin-left: auto; align-items: stretch; }
.nav-top a, .nav-bot a { color: inherit; text-decoration: none; display: flex; align-items: center; gap: 8px; font-family: var(--font-head); text-transform: uppercase; letter-spacing: .08em; font-size: 13px; transition: color var(--ease), background-color var(--ease), box-shadow var(--ease); }
.nav-top a { padding: 0 14px; min-height: 44px; border-radius: var(--r); box-shadow: inset 0 -2px 0 transparent; }
.nav-top a .icon { width: 16px; height: 16px; opacity: .85; }
.nav-top a[aria-current="page"] { color: var(--accent-line); box-shadow: inset 0 -2px 0 var(--accent-line); }
.nav-top a:hover { background: var(--hdr-hover); color: var(--accent-line); }
.ro-tag { align-self: center; font-family: var(--font-ui); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 3px 8px; border: 1px solid var(--accent-line); color: var(--accent-line); border-radius: var(--r); white-space: nowrap; }
.nav-bot { display: none; }

/* franjas de aviso: banda completa con regla izquierda semántica */
.banner { background: var(--warn-soft); color: var(--fg); border-bottom: var(--hair); border-left: 4px solid var(--warn); }
.banner .wrap { padding-block: 10px; font-size: .95rem; display: flex; gap: 8px; align-items: center; }
.banner.local { background: var(--accent-soft); border-left-color: var(--accent-line); }
.banner.local .wrap { flex-wrap: wrap; row-gap: 8px; }
.banner .b-txt { flex: 1 1 320px; min-width: 0; }
.banner .b-acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.banner .confirm { margin-top: 0; flex: 1 1 100%; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
#vacio-local .row { justify-content: center; }
#vacio-local a { color: var(--primary); font-weight: 600; }
.modos { margin-top: 14px; }
.modos h3 { margin: 0 0 6px; }
.modos ul { margin: 0; padding-left: 18px; }
.modos li { margin: 4px 0; }
main { padding-block: 22px 64px; position: relative; }

/* marca: gallo (versión navy en claro, versión clara en oscuro) y marca de agua */
.gallo-dk { display: none !important; }
.gallo-ico { width: auto; height: 56px; flex: none; display: block; }
.h1-gallo { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; }
.h1-gallo h1 { margin-right: 0; }
.wm { position: absolute; top: 4px; right: max(16px, env(safe-area-inset-right, 0px)); width: 240px; pointer-events: none; z-index: 1; opacity: .08; }
.wm img { width: 100%; height: auto; display: block; }
.empty { position: relative; overflow: hidden; }
.empty .wm { top: 50%; left: 50%; right: auto; transform: translate(-50%, -50%); }
.empty > :not(.wm) { position: relative; z-index: 2; }

/* marca de agua global: gallo grande fijo detrás de todas las pantallas */
.bg-wm { position: fixed; inset: 0; pointer-events: none; z-index: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.bg-wm img { height: clamp(360px, 88vh, 1000px); width: auto; max-width: none; opacity: .11; transform: translateX(14%); }
.top, .banner, main { position: relative; }
.top { position: sticky; }
.banner, main { z-index: 1; }
.aviso-base { flex: 1 1 100%; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--rule); border-left: 4px solid var(--rule); border-radius: var(--r); padding: 8px 12px; }
.aviso-base span { flex: 1 1 260px; }
/* superficies algo translúcidas para que el gallo de fondo se intuya también detrás de las tarjetas (sin color-mix quedan opacas) */
.card, .pcard, .gridwrap, details.acc, details.day { background: color-mix(in srgb, var(--surface) 82%, transparent); }
table.wk th.pers, table.wk thead th { background: color-mix(in srgb, var(--surface-2) 94%, transparent); }
table.wk tbody th.pers { background: color-mix(in srgb, var(--surface) 94%, transparent); }
.guia ol { margin: 8px 0 0; padding-left: 20px; }
.guia li { margin: 4px 0; }

/* powered by */
.powered { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; text-align: center; font-size: 11px; line-height: 16px; letter-spacing: .08em; color: var(--muted); background: var(--bg); border-top: var(--hair); padding: 4px 16px calc(4px + env(safe-area-inset-bottom, 0px)); }
.powered span { font-family: var(--font-head); }

/* encabezado de página: título Marcellus sobre doble filete, como la cabecera de una carta */
.page-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 4px double var(--rule); }
.page-head h1 { margin-right: auto; }

/* tarjeta: papel, filete dorado arriba, filete fino alrededor, sin sombra */
.card { background: var(--surface); border: var(--hair); border-top: 2px solid var(--rule); border-radius: var(--r); padding: 18px; }
.card > h2, .card > h3, section.card > .row > h2, .legal > h2 { position: relative; padding-bottom: 8px; margin-bottom: 10px !important; }
section.card > .row > h2 { margin-bottom: 0 !important; }
.card > h2::after, .card > h3::after, section.card > .row > h2::after, .legal > h2::after { content: ""; position: absolute; left: 0; bottom: 0; width: 36px; height: 2px; background: var(--rule); }
.card > h3 { font-size: 1.02rem; }
.stack > * + * { margin-top: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }

/* botones: Marcellus en versalitas espaciadas, esquinas rectas */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 8px 16px; border-radius: var(--r); border: 1px solid var(--primary); background: transparent; color: var(--primary); cursor: pointer; font-family: var(--font-head); font-weight: 400; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; line-height: 1.15; text-decoration: none; text-align: center; }
.btn:hover { background: var(--btn-bg); color: var(--btn-fg); border-color: var(--btn-bg); }
.btn.primary { background: var(--btn-bg); color: var(--btn-fg); border-color: var(--btn-bg); box-shadow: inset 0 0 0 3px var(--btn-bg), inset 0 0 0 4px var(--rule); }
.btn.primary:hover { color: var(--btn-hover-fg); }
.btn.gold { background: var(--accent-soft); color: var(--fg); border-color: var(--rule); }
.btn.gold:hover { background: var(--btn-bg); color: var(--btn-hover-fg); border-color: var(--btn-bg); }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.danger:hover { background: var(--bad); color: var(--on-bad); }
.btn.danger.solid { background: var(--bad); color: var(--on-bad); box-shadow: inset 0 0 0 3px var(--bad), inset 0 0 0 4px var(--bad-soft); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: transparent; color: var(--primary); border-color: transparent; box-shadow: inset 0 -1px 0 var(--rule); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .5; cursor: default; }
.btn.sm { min-height: 36px; padding: 4px 12px; font-size: 12px; }
.btn.big { min-height: 58px; font-size: 14px; padding: 10px 20px; flex: 1 1 200px; }
.btn svg { width: 17px; height: 17px; flex: none; }
.icon { width: 18px; height: 18px; flex: none; }

/* campos: libro de cuentas, solo regla inferior */
label.f { display: block; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.inp, select.inp { width: 100%; min-height: 40px; padding: 7px 2px 6px; border: 0; border-bottom: 1px solid var(--rule-ink); border-radius: var(--r); background: transparent; transition: border-color var(--ease), background-color var(--ease); }
select.inp { cursor: pointer; }
select.inp option { background: var(--surface); color: var(--fg); }
textarea.inp { border: 1px solid var(--line); border-bottom-color: var(--rule-ink); padding: 8px; }
.inp:hover { border-bottom-color: var(--fg); }
.inp:focus { outline: none; border-bottom-color: var(--rule); box-shadow: inset 0 -1px 0 var(--rule); background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
.inp:focus-visible { outline: none; }
.inp:disabled { opacity: .55; border-bottom-style: dotted; }
.inp.err { border-bottom-color: var(--bad); box-shadow: inset 0 -1px 0 var(--bad); }
.err-msg { color: var(--bad); font-size: .88rem; margin-top: 4px; }
.hint { color: var(--muted); font-size: .86rem; margin-top: 4px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px 18px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px 18px; }
.check { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--primary); }

/* sellos: etiquetas cuadradas con filete de 1 px */
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: var(--r); font-size: 11px; line-height: 1.35; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--rule-ink); background: transparent; color: var(--fg); white-space: nowrap; }
.pill.navy { background: var(--btn-bg); color: var(--btn-fg); border-color: var(--btn-bg); }
.pill.gold { background: var(--accent-soft); border-color: var(--rule); color: var(--fg); }
.pill.ok { color: var(--ok); border-color: var(--ok); }
.pill.warn { color: var(--warn); border-color: var(--warn); }
.pill.bad { color: var(--bad); border-color: var(--bad); }
.pill.nc { color: var(--warn); border: 1px dashed var(--warn); background: var(--warn-soft); }
.pill .link { text-transform: none; letter-spacing: 0; }

/* semáforos cuadrados */
.dot { width: 10px; height: 10px; border-radius: var(--r); display: inline-block; flex: none; }
.dot.verde { background: var(--ok); } .dot.ambar { background: var(--warn); } .dot.rojo { background: var(--bad); } .dot.cerrado { background: var(--closed); }
.sem-txt.verde { color: var(--ok); } .sem-txt.ambar { color: var(--warn); } .sem-txt.rojo { color: var(--bad); }

/* avisos en página: banda con regla izquierda semántica */
.alert-box { border-radius: var(--r); padding: 10px 14px; border: var(--hair); border-left: 4px solid var(--rule-ink); }
.alert-box.bad { background: var(--bad-soft); border-left-color: var(--bad); }
.alert-box.warn { background: var(--warn-soft); border-left-color: var(--warn); }
.alert-box.ok { background: var(--ok-soft); border-left-color: var(--ok); }
.alert-box.info { background: color-mix(in srgb, var(--primary-soft) 70%, transparent); border-left-color: var(--primary); }
.link { background: none; border: none; color: var(--primary); text-decoration: underline; text-decoration-color: var(--rule); text-decoration-thickness: 1px; text-underline-offset: 3px; cursor: pointer; padding: 4px; font-weight: 600; transition: color var(--ease), text-decoration-color var(--ease); }
.link:hover { text-decoration-color: var(--primary); }
.page-head > a, .page-head > .link { font-family: var(--font-head); text-transform: uppercase; letter-spacing: .08em; font-size: 13px; }
.empty { text-align: center; padding: 48px 16px; }
.empty h2 { margin-bottom: 8px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: end; }
.toolbar .fld { min-width: 0; }
.weeknav { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.weeknav .lbl { font-weight: 700; min-width: 150px; text-align: center; }
.sumline { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; font-size: 1rem; padding-top: 12px; border-top: 1px dashed var(--line); }
.sumline span { display: inline-flex; align-items: center; gap: 6px; }

/* grilla semanal */
.gridwrap { overflow-x: auto; border: var(--hair); border-top: 2px solid var(--rule); border-radius: var(--r); background: var(--surface); }
table.wk { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 900px; }
table.wk th, table.wk td { border-bottom: var(--hair); padding: 6px; vertical-align: top; text-align: left; }
table.wk td + td, table.wk th + td { border-left: 1px dotted var(--line); }
table.wk thead th { position: sticky; top: 0; background: var(--surface-2); font-size: .86rem; font-weight: 600; letter-spacing: .02em; z-index: 1; border-bottom: 4px double var(--rule); }
table.wk th.pers { min-width: 170px; position: sticky; left: 0; background: var(--surface); z-index: 2; border-right: 1px solid var(--rule); }
table.wk thead th.pers { background: var(--surface-2); z-index: 3; }
table.wk tr:last-child td, table.wk tr:last-child th { border-bottom: none; }
.pname { font-weight: 600; display: block; }
.pmeta { font-size: .8rem; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 2px; }
/* celda de turno: barra izquierda de 3 px con el color de la familia, tinte muy leve y filete fino */

      if (App.mode === 'local') return;
      App.user = u || null;
      if (!u) return;
      return u.can('data.write').then(function (v) { if (App.mode === 'local') return; App.perm = v; syncWrite(); render(); });
    }, function () { App.user = null; });

      App.db = db; App.mode = 'ok'; syncWrite();
      subscribe(); render();

    applyRO();
  }
  /* modo portátil: sin window.claude o sin capacidad db; los datos viven en este navegador */
  function modoLocal() {
    if (App.mode === 'local') return;

    if (LocalStore.vacio()) { var base = normalizarRespaldo(GALLETTI_EJEMPLO); if (base) { LocalStore.reemplazar(base); App.avisoBase = true; } }
    LocalStore.alFallar(function () { if (!App.avisoPersist) { App.avisoPersist = true; toast('Este navegador no permite guardar: los cambios se perderán al cerrar. Exporte un respaldo.', true); } });

  function bannerLocal() {

    if (App.bConf) h += '<div class="confirm" id="banner-confirm" role="alertdialog" aria-labelledby="banner-confirm-txt"><span id="banner-confirm-txt">' +

  function subscribe() {

      if (!App.fresh) { $('banner-txt').textContent = 'La base no responde todavía. Lo que ve puede estar desactualizado.'; $('banner').hidden = false; }
    }, 10000);
    COLS.forEach(function (name) {
      App.db.collection(name).onSnapshot(function (snap) {
        var m = {}; snap.docs.forEach(function (d) { m[d.id] = d.data(); });
        App.raw[name] = m; App.loaded[name] = true; markFresh(snap.metadata); scheduleRecompute();
      }, onDbError);
    });

    }, onDbError);

  function col(name) { return App.db.collection(name); }

    if (parts[1]) parts[1].split('&').forEach(function (kv) {

      else { cls += ' fam-' + (c.shift.tipo || 'intermedio'); l1 = c.shift.etiqueta; if (c.puesto !== p.puestoPrincipal) l2 = 'como ' + c.puesto; }
    } else if (c.tipo === 'descanso') { cls += ' fam-descanso'; l1 = 'Descanso'; }
    else if (c.tipo === 'ausencia') { cls += ' fam-ausencia'; l1 = E.NOV_NOMBRE[c.ausencia]; }
    else if (c.tipo === 'libre') { cls += ' fam-libre'; l1 = 'Libre'; }

  });
